name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Verify real Redis coordination
        run: >-
          ./mvnw -B -ntp -pl agent-permit-redis -am
          -Dtest=RedisResultIdempotencyGuardIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -DagentPermitRedisUri=redis://localhost:6379 test

  adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build candidate artifacts and verify the standalone consumer
        shell: pwsh
        run: ./scripts/verify-adoption.ps1
      - name: Retain unsigned candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-permit-candidate
          path: target/candidate/
          if-no-files-found: error
          retention-days: 7

  status:
    needs: [verify, adoption]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check status producer mapping tests
        run: python3 -m unittest scripts/test_export_status.py
      - name: Export mat-console.status/1 document
        run: >-
          python3 scripts/export_status.py
          --server-url "${{ github.server_url }}"
          --repository "${{ github.repository }}"
          --run-id "${{ github.run_id }}"
          --run-number "${{ github.run_number }}"
          --sha "${{ github.sha }}"
          --verify-result "${{ needs.verify.result || '' }}"
          --adoption-result "${{ needs.adoption.result || '' }}"
          --output status.json
      - name: Retain status document
        uses: actions/upload-artifact@v4
        with:
          name: mat-console-status
          path: status.json
          if-no-files-found: error
          retention-days: 7
